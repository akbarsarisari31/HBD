<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Kak Eka</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            position: relative;
        }

        .cake {
            width: 300px;
            height: 250px;
            margin: 0 auto 30px;
            position: relative;
        }

        /* Lapisan Kue 1 */
        .cake-layer-1 {
            width: 280px;
            height: 60px;
            background: linear-gradient(to bottom, #a3d2a7, #8bc88f);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            margin: 0 auto;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        /* Lapisan Kue 2 */
        .cake-layer-2 {
            width: 220px;
            height: 50px;
            background: linear-gradient(to bottom, #f7e8aa, #f5dfa8);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            margin: -10px auto 0;
            position: relative;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
        }

        /* Lapisan Kue 3 */
        .cake-layer-3 {
            width: 180px;
            height: 45px;
            background: linear-gradient(to bottom, #c5826f, #a8695c);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            margin: -8px auto 0;
            position: relative;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        /* Lilin */
        .candle {
            position: absolute;
            bottom: 45px;
            width: 6px;
            height: 35px;
            background: #66cccc;
            border-radius: 3px;
            animation: flicker 0.5s infinite alternate;
        }

        .candle:nth-child(1) { left: 60px; }
        .candle:nth-child(2) { left: 120px; }
        .candle:nth-child(3) { left: 180px; }
        .candle:nth-child(4) { left: 240px; }
        .candle:nth-child(5) { left: 90px; bottom: 80px; }

        /* Api Lilin */
        .flame {
            position: absolute;
            bottom: 38px;
            width: 4px;
            height: 15px;
            background: radial-gradient(ellipse at center, #ff6600, #ff8c00);
            border-radius: 50% 50% 50% 0;
            animation: flame 1.5s infinite;
        }

        .candle:nth-child(1) .flame { left: 61px; }
        .candle:nth-child(2) .flame { left: 121px; }
        .candle:nth-child(3) .flame { left: 181px; }
        .candle:nth-child(4) .flame { left: 241px; }
        .candle:nth-child(5) .flame { left: 91px; }

        @keyframes flicker {
            0% { opacity: 0.8; }
            100% { opacity: 1; }
        }

        @keyframes flame {
            0%, 100% { transform: translateY(0) scaleX(1); }
            50% { transform: translateY(-3px) scaleX(0.8); }
        }

        /* Konfeti */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
            animation: fall 3s linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Text */
        h1 {
            color: white;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            animation: bounce 1s infinite;
        }

        h2 {
            color: #fff;
            font-size: 36px;
            margin-top: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        p {
            color: #fff;
            font-size: 18px;
            margin-top: 20px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Button */
        button {
            margin-top: 30px;
            padding: 12px 30px;
            font-size: 16px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 Happy Birthday 🎉</h1>
        <div class="cake">
            <div class="cake-layer-1"></div>
            <div class="cake-layer-2"></div>
            <div class="cake-layer-3">
                <div class="candle">
                    <div class="flame"></div>
                </div>
                <div class="candle">
                    <div class="flame"></div>
                </div>
                <div class="candle">
                    <div class="flame"></div>
                </div>
                <div class="candle">
                    <div class="flame"></div>
                </div>
                <div class="candle">
                    <div class="flame"></div>
                </div>
            </div>
        </div>
        <h2>Kak Eka 🎂</h2>
        <p>Semoga hari spesialmu penuh dengan kebahagiaan dan tawa yang meriah! 💝</p>
        <button onclick="createConfetti()">🎊 Rayakan! 🎊</button>
    </div>

    <script>
        const confettiColors = ['#4CAF50', '#FFC107', '#2196F3', '#FF5722', '#9C27B0', '#3F51B5', '#00BCD4', '#009688'];

        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * window.innerWidth + 'px';
                confetti.style.top = '-10px';
                confetti.style.background = confettiColors[Math.floor(Math.random() * confettiColors.length)];
                confetti.style.animation = `fall ${2 + Math.random() * 1}s linear forwards`;
                document.body.appendChild(confetti);

                setTimeout(() => confetti.remove(), 3000);
            }
        }

        // Auto confetti saat page load
        window.addEventListener('load', () => {
            createConfetti();
        });
    </script>
</body>
</html>
