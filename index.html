<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday kakakkuuu</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #d3dae8; font-family: 'Curlz MT', cursive; overflow: hidden; }
        canvas { display: block; background-color: #d3dae8; max-width: 100vw; max-height: 100vh; }
        .text-overlay { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 10; }
        .text-overlay h1 { font-size: 50px; color: #333; font-weight: bold; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); }
        .text-overlay h2 { font-size: 40px; color: #333; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <canvas id="canvas" width="900" height="800"></canvas>
    <div class="text-overlay"><h1>Happy Birthday</h1><h2>kakakkuuu</h2></div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const colors = { light_green:'#c5e8c8', medium_green:'#a3d2a7', light_yellow:'#f7e8aa', cream:'#fffceb', brown:'#8b5a2b', dark_brown:'#5e4425', orange:'#ffa500', teal:'#66cccc', flame_orange:'#ff6600', sky_blue:'#87ceeb', light_steel:'#b0c4de', confetti_colors:['#4CAF50','#FFC107','#2196F3','#FF5722','#9C27B0','#3F51B5','#00BCD4','#009688'] };
        function ellipseX(width, deg) { return width * Math.cos(deg * Math.PI / 180); }
        function ellipseY(height, deg) { return height * Math.sin(deg * Math.PI / 180); }
        function ellipse(x,y,w,h,stroke,fill) { ctx.beginPath(); ctx.strokeStyle=stroke; ctx.fillStyle=fill; ctx.lineWidth=3; for(let d=0;d<360;d++){const px=ellipseX(w,d)+x, py=ellipseY(h,d)+y; d===0?ctx.moveTo(px,py):ctx.lineTo(px,py);} ctx.closePath(); ctx.fill(); ctx.stroke(); }
        function candle(x,y,h) { ctx.fillStyle=colors.teal; ctx.fillRect(x-4,y,8,h); ctx.strokeStyle='white'; ctx.lineWidth=2; for(let i=1;i<6;i++){ctx.beginPath();ctx.moveTo(x+4,y+10*i);ctx.lineTo(x-4,y+10*i);ctx.stroke();} ctx.fillStyle=colors.flame_orange; ctx.beginPath(); ctx.ellipse(x,y+h+10,4,10,0,0,Math.PI*2); ctx.fill(); }
        function dots(count,xMin,xMax,yMin,yMax,sizeMin,sizeMax){ for(let i=0;i<count;i++){const x=Math.random()*(xMax-xMin)+xMin+450,y=Math.random()*(yMax-yMin)+yMin+400,s=Math.random()*(sizeMax-sizeMin)+sizeMin;ctx.fillStyle=colors.confetti_colors[Math.floor(Math.random()*colors.confetti_colors.length)];ctx.beginPath();ctx.arc(x,y,s,0,Math.PI*2);ctx.fill();} }
        function draw(){
            ctx.fillStyle='#d3dae8'; ctx.fillRect(0,0,900,800); const x=450,y=350;
            ellipse(x,y,150,60,'white',colors.light_green);
            ctx.fillStyle=colors.medium_green; ctx.beginPath(); ctx.ellipse(x,y+5,150,65,0,0,Math.PI*2); ctx.fill();
            ellipse(x,y,120,48,'white',colors.light_yellow);
            ellipse(x,y+70,120,48,colors.light_yellow,colors.light_yellow); ellipse(x,y+70,110,44,colors.cream,colors.cream);
            ctx.fillStyle=colors.sky_blue; ctx.beginPath(); ctx.ellipse(x,y+10,120,48,0,0,Math.PI*2); ctx.fill();
            ellipse(x,y+120,80,32,colors.brown,colors.brown); ellipse(x,y+120,70,28,colors.orange,colors.orange);
            [[x+60,y+120,50],[x-60,y+120,50],[x,y+130,50],[x+30,y+110,50],[x-30,y+110,50]].forEach(p=>candle(...p));
            [[80,-120,120,-25,30,2,5],[40,-90,90,-35,10,2,5],[40,-80,80,60,90,2,5],[30,-50,50,45,70,2,5],[50,-500,500,120,300,3,5]].forEach(r=>dots(...r));
        }
        draw();
    </script>
</body>
</html>
